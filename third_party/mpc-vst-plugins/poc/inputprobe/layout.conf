# Input probe: what MPC sends to a plugin for a Q-Link turn, a data-wheel click or a touch drag. Three controls of
# the kinds that matter (a continuous knob, a whole-number knob, a 9-option list) and a MARK button that writes a
# marker line into the log, to separate the tests. Nothing here makes a sound. See docs/NOTES.md "Input probe".
[tab PROBE]
frame x=40 y=100 w=1200 h=500 title="INPUT PROBE: log /tmp/inputprobe.log"
knob cx=200 cy=250 r=58 label="CONTINUOUS" key=cont
knob cx=480 cy=250 r=58 label="WHOLE 1..8" key=int
enum_h cx=900 cy=250 label="OPTIONS (9)" key=opt sw=110 rows=3
button cx=640 cy=500 label="MARK" key=mark
qlinks "PROBE" = cont,int,opt
