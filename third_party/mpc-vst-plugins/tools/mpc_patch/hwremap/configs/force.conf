# hwremap config for Akai Force -> /sdcard/hwremap.conf on the device.
# Force button notes (channel 1): Shift 49, Menu 2, Knobs 1, Mixer 11, Master 5

log 0

# With Shift held, remapped buttons keep their normal function unless a "held" rule says otherwise.
hold 49

# Knobs: short = Shift + Knobs, long = plain Knobs press, double = the original long press
# (Knobs held while the button is held, at least holdms). Shift + Knobs = plain Knobs.
tap 1 d49 b1 u49
long 1 b1
dbl 1 h1
held 1 u49 b1 d49
longms 400
holdms 800

# Mixer twice: Master (the first press opens the mixer as usual)
dbl 11 b5

# Menu twice: tap the Main Mode icon (the first press opens the menu as usual)
dbl 2 t331,655
touchms 150

dblms 350
